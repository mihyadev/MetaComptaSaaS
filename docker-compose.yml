# ============================================
# MetaCompta SAS - Docker Compose
# Uses local DELL\SQLEXPRESS (port 58080)
# Stack: API + BackOffice + Extranet + Admin
# ============================================

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: metacompta-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,58080;Database=MetaComptaSASDb_Dev;User Id=sa;Password=RS2iRS2i;TrustServerCertificate=true;MultipleActiveResultSets=true
      - Jwt__Key=MetaComptaSAS-SuperSecretKey-2026-MustBe256BitsLong!!
      - Jwt__Issuer=MetaComptaAPI
      - Jwt__Audience=MetaComptaClients
      - Email__Host=smtp.gmail.com
      - Email__Port=587
      - Email__EnableSsl=true
      - Email__UserName=mohamedihya1991@gmail.com
      - Email__Password=ypoa yoap yfgn oeve
      - Email__FromAddress=mohamedihya1991@gmail.com
      - Email__FromName=MetaCompta
      - PortalUrls__BackOffice=http://localhost:7101
      - PortalUrls__Extranet=http://localhost:7102
      - PortalUrls__Admin=http://localhost:7103
    ports:
      - "7100:8080"
    volumes:
      - metacompta-uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - metacompta-network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  backoffice:
    build:
      context: .
      dockerfile: Dockerfile
      target: backoffice
    container_name: metacompta-backoffice
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://api:8080
      - PortalUrls__Extranet=http://localhost:7102
      - PortalUrls__Admin=http://localhost:7103
    ports:
      - "7101:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - metacompta-network
    restart: unless-stopped

  extranet:
    build:
      context: .
      dockerfile: Dockerfile
      target: extranet
    container_name: metacompta-extranet
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://api:8080
    ports:
      - "7102:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - metacompta-network
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    container_name: metacompta-admin
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ApiSettings__BaseUrl=http://api:8080
    ports:
      - "7103:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - metacompta-network
    restart: unless-stopped

networks:
  metacompta-network:
    driver: bridge

volumes:
  metacompta-uploads: